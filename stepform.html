<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fintoo Wealth Advisory Consultation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { jakarta: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
          colors: {
            fintoo: {
              navy: '#042b62',
              navy2: '#073b84',
              orange: '#dd7300',
              gold: '#c59738',
              ink: '#10233f',
              muted: '#657286',
              line: '#dbe3ee',
              soft: '#f5f8fc'
            }
          },
          boxShadow: {
            concierge: '0 28px 80px rgba(4, 43, 98, 0.18)',
            premium: '0 18px 42px rgba(4, 43, 98, 0.10)'
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseDot {

      0%,
      80%,
      100% {
        opacity: .35;
        transform: translateY(0);
      }

      40% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    @keyframes pop {
      0% {
        opacity: 0;
        transform: scale(.72);
      }

      70% {
        opacity: 1;
        transform: scale(1.08);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-rise {
      animation: rise 360ms ease both;
    }

    .animate-pop {
      animation: pop 440ms ease both;
    }

    .typing-dot {
      animation: pulseDot 900ms infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 120ms;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 240ms;
    }

    .assistant-avatar {
      display: grid;
      place-items: center;
      width: 2.25rem;
      height: 2.25rem;
      flex-shrink: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #042b62, #073b84);
      color: #fff;
      font-size: .875rem;
      font-weight: 800;
      box-shadow: 0 12px 24px rgba(4, 43, 98, .18);
    }

    .assistant-bubble {
      max-width: min(560px, calc(100% - 56px));
      border-radius: 20px 20px 20px 8px;
      background: #fff;
      padding: .85rem 1rem;
      line-height: 1.55;
      box-shadow: 0 18px 42px rgba(4, 43, 98, .10);
    }

    .user-bubble {
      max-width: min(560px, calc(100% - 56px));
      border-radius: 20px 20px 8px 20px;
      background: linear-gradient(135deg, #042b62, #0c438e);
      color: #fff;
      padding: .85rem 1rem;
      line-height: 1.55;
      box-shadow: 0 18px 42px rgba(4, 43, 98, .10);
      overflow-wrap: anywhere;
    }

    .primary-action {
      min-height: 52px;
      border-radius: 1rem;
      background: linear-gradient(135deg, #dd7300, #b85d00);
      color: #fff;
      padding: 0 1.25rem;
      font-weight: 800;
      box-shadow: 0 14px 28px rgba(221, 115, 0, .26);
      transition: transform .2s ease, opacity .2s ease, box-shadow .2s ease;
    }

    .primary-action:hover {
      transform: translateY(-2px);
    }

    .primary-action:disabled {
      cursor: not-allowed;
      opacity: .45;
      transform: none;
      box-shadow: none;
    }

    .field-surface {
      border: 1px solid rgba(219, 227, 238, .9);
      border-radius: 18px;
      background: rgba(255, 255, 255, .92);
      padding: .85rem;
      box-shadow: 0 18px 42px rgba(4, 43, 98, .10);
    }

    @media (min-width: 640px) {
      .field-surface {
        padding: 1.25rem;
      }
    }

    .input-surface {
      display: flex;
      align-items: center;
      gap: .75rem;
      border: 1px solid #dbe3ee;
      border-radius: 1rem;
      background: #fff;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .input-surface:focus-within {
      border-color: rgba(221, 115, 0, .72);
      box-shadow: 0 0 0 4px rgba(221, 115, 0, .10);
    }

    .premium-input {
      width: 100%;
      min-height: 54px;
      border-radius: 1rem;
      background: transparent;
      padding: 0 1rem;
      color: #10233f;
      outline: none;
    }

    .premium-input::placeholder {
      color: #94a3b8;
    }

    .income-choice {
      min-height: 50px;
      border: 1px solid #dbe3ee;
      border-radius: 1rem;
      background: #fff;
      padding: .75rem;
      text-align: left;
      color: #10233f;
      font-size: .82rem;
      font-weight: 800;
      line-height: 1.2;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .income-choice:hover {
      transform: translateY(-2px);
      border-color: #c59738;
      box-shadow: 0 18px 42px rgba(4, 43, 98, .10);
    }

    .income-choice.is-selected {
      border-color: #c59738;
      background: #fff8ed;
      box-shadow: 0 18px 42px rgba(4, 43, 98, .10);
    }

    .date-active,
    .slot-active {
      border-color: #dd7300 !important;
      background: #dd7300 !important;
      color: #fff !important;
      box-shadow: 0 10px 18px rgba(221, 115, 0, .26);
    }

    #chatArea {
      background-color: #fbfcfe;
      background-image:
        url("data:image/svg+xml,%3Csvg width='220' height='220' viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23042b62' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' opacity='.055'%3E%3Cpath d='M34 58h42M34 78h30M44 42v52'/%3E%3Cpath d='M151 50c20 0 34 13 34 31s-14 31-34 31-34-13-34-31 14-31 34-31Z'/%3E%3Cpath d='M137 74h29M137 88h20M148 64v36'/%3E%3Cpath d='M32 158l24-22 26 18 34-42 29 25 42-54'/%3E%3Cpath d='M42 170h132M58 170v-22M88 170v-34M118 170v-52M148 170v-41'/%3E%3Cpath d='M170 154c10 0 18 8 18 18s-8 18-18 18-18-8-18-18 8-18 18-18Z'/%3E%3Cpath d='M164 172h12M170 166v12'/%3E%3C/g%3E%3C/svg%3E"),
        linear-gradient(rgba(4, 43, 98, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(4, 43, 98, .035) 1px, transparent 1px),
        radial-gradient(circle at 18% 18%, rgba(221, 115, 0, .08), transparent 28%),
        radial-gradient(circle at 82% 78%, rgba(4, 43, 98, .07), transparent 26%);
      background-position: center, 0 0, 0 0, center, center;
      background-size: 220px 220px, 28px 28px, 28px 28px, 100% 100%, 100% 100%;
    }

    #chatArea.intro-mode {
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 1.25rem;
    }

    .intro-panel {
      width: min(100%, 340px);
      text-align: center;
    }

    .intro-mark {
      display: grid;
      place-items: center;
      width: 3rem;
      height: 3rem;
      margin: 0 auto 1rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #042b62, #073b84);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 14px 28px rgba(4, 43, 98, .22);
    }

    .intro-copy {
      border-radius: 24px;
      background: #fff;
      padding: 1.25rem;
      line-height: 1.6;
      box-shadow: 0 18px 42px rgba(4, 43, 98, .10);
    }

    .intro-copy strong {
      display: block;
      margin-bottom: .75rem;
      color: #042b62;
      font-size: 1.05rem;
    }

    .intro-panel .primary-action {
      width: 100%;
      margin-top: 1rem;
    }

    @media (min-width: 640px) {
      .assistant-avatar {
        width: 2.75rem;
        height: 2.75rem;
        font-size: 1rem;
      }

      .assistant-bubble,
      .user-bubble {
        padding: 1rem 1.25rem;
        line-height: 1.65;
      }

      .field-surface {
        border-radius: 22px;
        padding: 1.25rem;
      }

      .income-choice {
        min-height: 74px;
        padding: 1rem;
        font-size: 1rem;
      }
    }
  </style>
</head>

<body
  class="min-h-screen overflow-x-hidden bg-white font-jakarta text-fintoo-ink antialiased">
  <div class="hidden
    animate-rise animate-pop flex grid hidden justify-end items-center gap-1.5 gap-3 gap-4
    h-2 h-9 h-11 h-24 w-2 w-9 w-11 w-24 w-[76px] max-w-xl
    min-h-11 min-h-[20px] min-h-[50px] min-h-[52px] min-h-[54px] min-h-[60px] min-h-[74px]
    rounded-full rounded-xl rounded-2xl rounded-[20px] rounded-[22px] rounded-[28px] rounded-bl-lg rounded-br-lg
    border border-0 border-b border-fintoo-line border-fintoo-line/80 border-fintoo-line/90 border-fintoo-gold border-fintoo-orange
    bg-white bg-white/90 bg-white/55 bg-transparent bg-[#f3f6fa] bg-[#f4faf6] bg-[#fff8ed] bg-slate-50 bg-fintoo-orange bg-[#138a4a]
    bg-gradient-to-br bg-gradient-to-r from-fintoo-navy from-fintoo-orange from-[#138a4a] to-fintoo-navy2 to-[#0c438e] to-[#b85d00] to-[#20b86a] to-fintoo-gold
    p-0 p-4 p-5 p-7 p-10 px-4 px-5 py-3 py-4 pt-1 pt-3 pl-0 pl-4 mt-4 mt-7 mb-2 mb-4 mb-6
    text-white text-fintoo-ink text-fintoo-navy text-fintoo-muted text-fintoo-orange text-red-700 text-slate-400 text-[#138a4a]
    text-sm text-xl text-4xl font-bold font-extrabold leading-relaxed text-left text-right text-center
    shadow-lg shadow-premium shadow-[0_14px_28px_rgba(221,115,0,.26)] shadow-[0_10px_18px_rgba(221,115,0,.26)]
    transition duration-200 duration-500 hover:-translate-y-0.5 hover:border-fintoo-gold hover:shadow-premium
    disabled:translate-y-0 disabled:cursor-not-allowed disabled:opacity-45 disabled:shadow-none disabled:bg-slate-50 disabled:text-slate-400
    focus:border-fintoo-orange focus:ring-4 focus:ring-fintoo-orange/10 focus-within:border-fintoo-orange/70 focus-within:ring-4 focus-within:ring-fintoo-orange/10
    sm:grid-cols-2 sm:min-h-[60px] sm:p-5 sm:p-10 lg:grid-cols-2">
  </div>
  <main class="h-[100dvh] overflow-hidden bg-[linear-gradient(115deg,#062b63_0%,#0b3b88_48%,#2447b8_100%)] lg:min-h-screen lg:overflow-auto">
    <section class="mx-auto grid h-full w-full max-w-7xl items-center gap-4 px-3 py-3 sm:px-8 lg:min-h-screen lg:grid-cols-[1fr_520px] lg:gap-10 lg:px-10 lg:py-10"
      aria-label="Fintoo consultation booking">
      <aside class="relative hidden overflow-hidden py-4 text-white lg:block lg:py-0">
        <img src="https://www.fintoo.in/static/media/wp/Fintoowhitelogo_.svg" alt="Fintoo"
          class="mb-7 h-8 w-auto lg:mb-6">
        <div class="mb-9 flex flex-wrap gap-3">
          <span class="rounded-full bg-white px-4 py-2 text-sm font-extrabold text-fintoo-navy shadow-lg text-slate-900">Free Consultation</span>
          <span class="rounded-full bg-white px-4 py-2 text-sm font-extrabold text-fintoo-navy shadow-lg text-slate-900">15-Min Session</span>
          <span class="rounded-full bg-white px-4 py-2 text-sm font-extrabold text-fintoo-navy shadow-lg text-slate-900">Certified Advisors</span>
        </div>
        <p class="mb-4 text-xs font-extrabold uppercase tracking-[0.18em] text-white/70">Private Wealth Concierge</p>
        <h1 class="max-w-3xl text-[2.55rem] font-extrabold leading-[1.05] text-white sm:text-[3.4rem] lg:text-[4rem]">
          Plan smarter. <span class="text-fintoo-orange">Invest better.</span> Grow confidently.
        </h1>
        <p class="mt-7 max-w-2xl text-lg font-medium leading-relaxed text-white/80 sm:text-xl">
          Schedule a complimentary 1-on-1 wealth planning session with a certified Fintoo financial advisor.
        </p>
       
       
      </aside>

      <section id="chatShell"
        class="flex h-full min-h-0 w-full flex-col overflow-hidden rounded-[24px] border border-white/70 bg-white shadow-concierge lg:min-h-[620px] lg:max-h-[760px] lg:rounded-[28px]">
        <div id="chatArea" class="min-h-0 flex-1 overflow-auto bg-[#fbfcfe] px-4 py-4 sm:px-7 sm:py-5" aria-live="polite"></div>
        <div id="controls" class="max-h-[42dvh] shrink-0 overflow-auto border-t border-fintoo-line/70 bg-white px-4 pb-4 pt-3 sm:max-h-none sm:px-7 sm:pb-6 sm:pt-4"></div>
      </section>
    </section>
  
  </main>

  <script>
    const state = {
      step: 1,
      firstName: '',
      name: '',
      email: '',
      city: '',
      income: '',
      mobile: '',
      date: '',
      time: ''
    };

    const chatArea = document.getElementById('chatArea');
    const controls = document.getElementById('controls');

    const incomeOptions = [
      'Under ₹10 Lakhs',
      '₹10 Lakhs – ₹25 Lakhs',
      '₹25 Lakhs – ₹50 Lakhs',
      '₹50 Lakhs – ₹1 Crore',
      '₹1 Crore – ₹5 Crore',
      'Above ₹5 Crore'
    ];
    const slots = ['09:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '02:00 PM', '03:00 PM', '04:00 PM', '05:00 PM'];
    const availableDates = [17, 18, 20, 23, 24, 25, 27, 30];

    const assistantText = {
      1: 'Welcome to Fintoo Wealth Advisory.\n\nLet\'s understand your financial goals and schedule a consultation with one of our experts.',
      2: 'What should I call you?',
      3: () => `${state.firstName}, what's your email address?`,
      4: () => `${state.firstName}, which city are you based in?`,
      5: 'To connect you with the right advisor, what\'s your annual income range?',
      6: 'What\'s the best number for our advisor to reach you on?',
      7: 'Let\'s quickly verify your number.',
      8: () => `Great ${state.firstName}. Let's schedule your consultation.`,
      9: () => `Excellent choice, ${state.firstName}.`
    };

    const cardClass = 'animate-rise field-surface';
    const primaryBtn = 'primary-action';
    const inputWrap = 'input-surface';
    const inputClass = 'premium-input';

    function focusOnDesktop(element) {
      if (window.matchMedia('(min-width: 768px)').matches) element.focus();
    }

    function scrollChat() {
      requestAnimationFrame(() => {
        chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'auto' });
      });
    }

    function addMessage(type, text) {
      const row = document.createElement('div');
      const isUser = type === 'user';
      row.className = `animate-rise mb-3 flex gap-3 ${isUser ? 'justify-end' : ''}`;
      row.innerHTML = isUser
        ? `<div class="user-bubble">${escapeHtml(text).replace(/\n/g, '<br>')}</div>`
        : `<div class="assistant-avatar">F</div><div class="assistant-bubble">${escapeHtml(text).replace(/\n/g, '<br>')}</div>`;
      chatArea.appendChild(row);
      scrollChat();
    }

    function showTyping(next) {
      const row = document.createElement('div');
      row.className = 'animate-rise mb-3 flex gap-3';
      row.innerHTML = `
        <div class="assistant-avatar">F</div>
        <div class="flex min-h-11 w-[76px] items-center gap-1.5 rounded-[20px] rounded-bl-lg bg-white px-5 py-4 shadow-premium" aria-label="Fintoo assistant is typing">
          <i class="typing-dot h-2 w-2 rounded-full bg-fintoo-orange"></i>
          <i class="typing-dot h-2 w-2 rounded-full bg-fintoo-orange"></i>
          <i class="typing-dot h-2 w-2 rounded-full bg-fintoo-orange"></i>
        </div>`;
      chatArea.appendChild(row);
      scrollChat();
      setTimeout(() => {
        row.remove();
        next();
      }, 520);
    }

    function goTo(step) {
      state.step = step;
      controls.innerHTML = '';
      if (step === 1) {
        renderIntro();
        return;
      }
      controls.classList.remove('hidden');
      if (chatArea.classList.contains('intro-mode')) {
        chatArea.classList.remove('intro-mode');
        chatArea.innerHTML = '';
      }
      const copy = assistantText[step];
      showTyping(() => {
        addMessage('assistant', typeof copy === 'function' ? copy() : copy);
        renderControls();
      });
    }

    function answer(text, nextStep) {
      addMessage('user', text);
      goTo(nextStep);
    }

    function renderIntro() {
      controls.classList.add('hidden');
      chatArea.classList.add('intro-mode');
      chatArea.innerHTML = `
        <div class="intro-panel animate-rise">
          <div class="intro-mark">F</div>
          <div class="intro-copy">
            <strong>Welcome to Fintoo Wealth Advisory.</strong>
            <span>Let's understand your financial goals and schedule a consultation with one of our experts.</span>
          </div>
          <button class="${primaryBtn}" type="button" id="introStart">Let's Begin</button>
        </div>`;
      document.getElementById('introStart').addEventListener('click', () => goTo(2));
    }

    function renderControls() {
      if (state.step === 2) {
        renderTextField('name', 'Enter your full name', 'text', value => {
          if (value.trim().length < 2) return 'Please enter your name.';
        }, value => {
          state.name = value.trim();
          state.firstName = state.name.split(' ')[0];
          addMessage('user', state.name);
          showTyping(() => {
            addMessage('assistant', `Nice to meet you, ${state.firstName}.`);
            goTo(3);
          });
        });
      }

      if (state.step === 3) {
        renderTextField('email', 'name@example.com', 'email', value => {
          const email = value.trim();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return 'Please enter a valid email address.';
        }, value => {
          state.email = value.trim();
          answer(state.email, 4);
        }, true);
      }

      if (state.step === 4) {
        renderTextField('city', 'Enter your city', 'text', value => {
          if (value.trim().length < 2) return 'Please enter your city.';
        }, value => {
          state.city = value.trim();
          answer(state.city, 5);
        });
      }

      if (state.step === 5) renderIncome();
      if (state.step === 6) renderMobileField();
      if (state.step === 7) renderOtp();
      if (state.step === 8) renderBooking();
      if (state.step === 9) renderSummary();
    }

    function renderTextField(id, placeholder, type, validator, onSubmit, liveValidate = false) {
      controls.innerHTML = `
        <form class="${cardClass}" novalidate>
          <div class="${inputWrap}"><input id="${id}" class="${inputClass}" type="${type}" placeholder="${placeholder}" autocomplete="${id === 'email' ? 'email' : 'name'}"></div>
          <div class="min-h-[20px] pt-1 text-sm font-bold text-red-700" id="error"></div>
          <button class="${primaryBtn} w-full" type="submit">Continue</button>
        </form>`;
      const form = controls.querySelector('form');
      const input = controls.querySelector('input');
      const error = controls.querySelector('#error');
      const validate = () => {
        const message = validator(input.value);
        error.textContent = message || '';
        return !message;
      };
      if (liveValidate) input.addEventListener('input', () => input.value ? validate() : error.textContent = '');
      form.addEventListener('submit', event => {
        event.preventDefault();
        if (validate()) {
          input.blur();
          onSubmit(input.value);
        }
      });
      focusOnDesktop(input);
    }

    function renderIncome() {
      controls.innerHTML = `
        <div class="${cardClass}">
          <div class="grid grid-cols-2 gap-2 sm:gap-3">
            ${incomeOptions.map(item => `<button class="choice income-choice" type="button">${item}</button>`).join('')}
          </div>
        </div>`;
      controls.querySelectorAll('.choice').forEach(button => {
        button.addEventListener('click', () => {
          controls.querySelectorAll('.choice').forEach(item => item.classList.remove('is-selected'));
          button.classList.add('is-selected');
          state.income = button.textContent;
          setTimeout(() => answer(state.income, 6), 260);
        });
      });
    }

    function renderMobileField() {
      controls.innerHTML = `
        <form class="${cardClass}" novalidate>
          <div class="${inputWrap}"><span class="pl-4 font-extrabold text-fintoo-navy">+91</span><input id="mobile" class="${inputClass} pl-0" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digit mobile number" autocomplete="tel"></div>
          <div class="min-h-[20px] pt-1 text-sm font-bold text-red-700" id="error"></div>
          <button class="${primaryBtn} w-full" type="submit">Send OTP</button>
        </form>`;
      const input = controls.querySelector('input');
      const error = controls.querySelector('#error');
      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(0, 10);
        error.textContent = input.value.length && input.value.length !== 10 ? 'Mobile number must be 10 digits.' : '';
      });
      controls.querySelector('form').addEventListener('submit', event => {
        event.preventDefault();
        if (input.value.length !== 10) {
          error.textContent = 'Please enter a valid 10 digit Indian mobile number.';
          return;
        }
        input.blur();
        state.mobile = `+91 ${input.value}`;
        answer(state.mobile, 7);
      });
      focusOnDesktop(input);
    }

    function renderOtp() {
      controls.innerHTML = `
        <div class="${cardClass}">
          <div class="grid grid-cols-6 gap-1.5 sm:gap-3">${Array.from({ length: 6 }, (_, index) => `<input class="min-h-[46px] rounded-xl border border-fintoo-line bg-white p-0 text-center text-lg font-extrabold outline-none transition focus:border-fintoo-orange focus:ring-4 focus:ring-fintoo-orange/10 sm:min-h-[60px] sm:rounded-2xl sm:text-xl" aria-label="OTP digit ${index + 1}" inputmode="numeric" maxlength="1">`).join('')}</div>
          <button class="mt-4 w-max border-0 bg-transparent font-extrabold text-fintoo-orange" type="button">Resend OTP</button>
          <div class="mt-4 hidden items-center gap-3 font-extrabold text-[#138a4a]" id="verified"><span class="animate-pop grid h-9 w-9 place-items-center rounded-full bg-[#138a4a] text-white">✓</span><span>Number verified</span></div>
        </div>`;
      const inputs = [...controls.querySelectorAll('input')];
      const verified = controls.querySelector('#verified');
      inputs.forEach((input, index) => {
        input.addEventListener('input', () => {
          input.value = input.value.replace(/\D/g, '').slice(0, 1);
          if (input.value && inputs[index + 1]) inputs[index + 1].focus();
          if (inputs.every(item => item.value)) {
            input.blur();
            verified.classList.remove('hidden');
            verified.classList.add('flex');
            setTimeout(() => {
              addMessage('assistant', 'Perfect, your number has been verified.');
              goTo(8);
            }, 760);
          }
        });
        input.addEventListener('keydown', event => {
          if (event.key === 'Backspace' && !input.value && inputs[index - 1]) inputs[index - 1].focus();
        });
      });
      controls.querySelector('button').addEventListener('click', event => {
        event.currentTarget.textContent = 'OTP resent';
        setTimeout(() => event.currentTarget.textContent = 'Resend OTP', 1600);
      });
      focusOnDesktop(inputs[0]);
    }

    function renderBooking() {
      state.date = '';
      state.time = '';
      renderBookingCalendar();
    }

    function renderBookingCalendar() {
      controls.innerHTML = `
        <div class="${cardClass}">
          <div class="rounded-[16px] border border-fintoo-line bg-white p-3 sm:rounded-[20px] sm:p-4">
            <div class="mb-3 flex items-center justify-between gap-3 text-sm font-extrabold text-fintoo-navy sm:mb-4 sm:text-base"><span>Select Date</span><span>June 2026</span></div>
            <div class="mb-2 grid grid-cols-7 gap-1.5 text-center text-xs font-extrabold text-fintoo-muted">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(day => `<span>${day}</span>`).join('')}</div>
            <div class="grid grid-cols-7 gap-1.5" id="dates"></div>
          </div>
          <p class="pt-3 text-xs font-bold text-fintoo-muted">Pick an available date to view time slots.</p>
        </div>`;
      const dates = controls.querySelector('#dates');
      dates.appendChild(document.createElement('span'));
      for (let day = 1; day <= 30; day++) {
        const button = document.createElement('button');
        button.className = 'aspect-square rounded-lg bg-[#f3f6fa] text-xs font-extrabold text-fintoo-ink transition disabled:cursor-not-allowed disabled:bg-slate-50 disabled:text-slate-400 sm:rounded-xl sm:text-sm';
        button.type = 'button';
        button.textContent = day;
        button.disabled = !availableDates.includes(day);
        button.addEventListener('click', () => {
          controls.querySelectorAll('#dates button').forEach(item => item.classList.remove('date-active'));
          button.classList.add('date-active');
          state.date = `June ${day}, 2026`;
          state.time = '';
          setTimeout(renderBookingTimes, 180);
        });
        dates.appendChild(button);
      }
    }

    function renderBookingTimes() {
      controls.innerHTML = `
        <div class="${cardClass}">
          <div class="mb-3 flex items-center justify-between gap-3">
            <button class="rounded-full border border-fintoo-line bg-white px-3 py-1.5 text-xs font-extrabold text-fintoo-navy transition hover:border-fintoo-orange" type="button" id="backToCalendar">Back</button>
            <div class="text-right text-xs font-extrabold uppercase tracking-[0.12em] text-fintoo-muted">${state.date}</div>
          </div>
          <div class="mb-3 text-sm font-extrabold text-fintoo-navy sm:mb-4 sm:text-base">Select Time Slot</div>
          <div class="grid grid-cols-2 gap-2">${slots.map(slot => `<button class="slot min-h-[42px] rounded-xl border border-fintoo-line bg-white text-sm font-extrabold text-fintoo-navy transition sm:min-h-[50px] sm:rounded-2xl sm:text-base" type="button">${slot}</button>`).join('')}</div>
          <div class="min-h-[20px] pt-3 text-sm font-bold text-red-700" id="bookingError"></div>
          <button class="${primaryBtn} w-full" type="button" disabled id="bookingBtn">Continue</button>
        </div>`;
      const bookingBtn = controls.querySelector('#bookingBtn');
      const error = controls.querySelector('#bookingError');
      controls.querySelector('#backToCalendar').addEventListener('click', () => {
        state.date = '';
        state.time = '';
        renderBookingCalendar();
      });
      controls.querySelectorAll('.slot').forEach(button => {
        button.addEventListener('click', () => {
          controls.querySelectorAll('.slot').forEach(item => item.classList.remove('slot-active'));
          button.classList.add('slot-active');
          state.time = button.textContent;
          checkBooking();
        });
      });
      bookingBtn.addEventListener('click', () => {
        if (!state.date || !state.time) {
          error.textContent = 'Please select an available date and time slot.';
          return;
        }
        answer(`${state.date} at ${state.time}`, 9);
      });
      function checkBooking() {
        bookingBtn.disabled = !(state.date && state.time);
      }
    }

    function renderSummary() {
      controls.innerHTML = `
        <div class="${cardClass}">
          <div class="grid gap-1">
            ${summaryRow('Name', state.name)}
            ${summaryRow('Email', state.email)}
            ${summaryRow('City', state.city)}
            ${summaryRow('Income Slab', state.income)}
            ${summaryRow('Mobile Number', state.mobile)}
            ${summaryRow('Selected Date', state.date)}
            ${summaryRow('Selected Time', state.time)}
          </div>
          <button class="${primaryBtn} mt-4 w-full" type="button">Confirm Booking</button>
        </div>`;
      controls.querySelector('button').addEventListener('click', showSuccess);
    }

    function summaryRow(label, value) {
      return `<div class="grid grid-cols-[110px_minmax(0,1fr)] gap-3 border-b border-slate-100 py-2.5 text-sm sm:grid-cols-[140px_minmax(0,1fr)] sm:py-3 sm:text-base"><span class="text-fintoo-muted">${label}</span><span class="min-w-0 break-words text-right font-extrabold text-fintoo-navy">${value}</span></div>`;
    }

    function showSuccess() {
      state.step = 10;
      document.getElementById('chatShell').innerHTML = `
        <div class="grid min-h-full place-items-center px-4 py-10 text-center sm:px-7">
          <div class="animate-rise w-full max-w-xl rounded-[28px] border border-fintoo-line/90 bg-white/90 p-7 shadow-premium sm:p-10">
            <div class="animate-pop mx-auto mb-6 grid h-24 w-24 place-items-center rounded-full bg-gradient-to-br from-[#138a4a] to-[#20b86a] text-4xl font-extrabold text-white">✓</div>
            <h2 class="text-[1.8rem] font-extrabold leading-tight text-fintoo-navy sm:text-[2.35rem]">Your Consultation Has Been Reserved</h2>
            <p class="mx-auto mt-4 max-w-md leading-relaxed text-fintoo-muted">Thank you, ${escapeHtml(state.firstName)}.<br>One of our financial experts will connect with you at your scheduled time.</p>
            <div class="mt-7 grid gap-3 text-left">
              <div class="rounded-2xl bg-[#f4faf6] px-4 py-3 font-extrabold text-fintoo-navy">✓ Consultation Confirmed</div>
              <div class="rounded-2xl bg-[#f4faf6] px-4 py-3 font-extrabold text-fintoo-navy">✓ Advisory Desk Assigned</div>
              <div class="rounded-2xl bg-[#f4faf6] px-4 py-3 font-extrabold text-fintoo-navy">✓ Calendar Invitation Sent</div>
            </div>
          </div>
        </div>`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }

    goTo(1);
  </script>
</body>

</html>
